# Composer community plugins — pnpm workspace.
#
# Every plugin under plugins/* pins the DXOS SDK via the `dxos` named catalog below.
# The SDK ships as a single unit, so one find-replace of the version/commit here bumps
# every plugin in lockstep.
#
# `main` tracks the latest DXOS build via pkg.pr.new (the nightly "SDK upgrade" PR), but
# releases require a published npm version — the release workflow refuses to publish a
# plugin while the `dxos` catalog points at a pkg.pr.new / prerelease pin. See RELEASING.md.

packages:
  - 'packages/*'

catalogs:
  dxos:
    '@dxos/app-framework': 'https://pkg.pr.new/dxos/dxos/@dxos/app-framework@a0b524e6af'
    '@dxos/app-toolkit': 'https://pkg.pr.new/dxos/dxos/@dxos/app-toolkit@a0b524e6af'
    '@dxos/async': 'https://pkg.pr.new/dxos/dxos/@dxos/async@a0b524e6af'
    '@dxos/client': 'https://pkg.pr.new/dxos/dxos/@dxos/client@a0b524e6af'
    '@dxos/client-protocol': 'https://pkg.pr.new/dxos/dxos/@dxos/client-protocol@a0b524e6af'
    '@dxos/compute': 'https://pkg.pr.new/dxos/dxos/@dxos/compute@a0b524e6af'
    '@dxos/context': 'https://pkg.pr.new/dxos/dxos/@dxos/context@a0b524e6af'
    '@dxos/echo': 'https://pkg.pr.new/dxos/dxos/@dxos/echo@a0b524e6af'
    '@dxos/echo-client': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-client@a0b524e6af'
    '@dxos/echo-react': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-react@a0b524e6af'
    '@dxos/effect': 'https://pkg.pr.new/dxos/dxos/@dxos/effect@a0b524e6af'
    '@dxos/invariant': 'https://pkg.pr.new/dxos/dxos/@dxos/invariant@a0b524e6af'
    '@dxos/log': 'https://pkg.pr.new/dxos/dxos/@dxos/log@a0b524e6af'
    '@dxos/operation': 'https://pkg.pr.new/dxos/dxos/@dxos/operation@a0b524e6af'
    '@dxos/plugin-space': 'https://pkg.pr.new/dxos/dxos/@dxos/plugin-space@a0b524e6af'
    '@dxos/react-client': 'https://pkg.pr.new/dxos/dxos/@dxos/react-client@a0b524e6af'
    '@dxos/react-ui': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui@a0b524e6af'
    '@dxos/react-ui-form': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui-form@a0b524e6af'
    '@dxos/react-ui-stack': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui-stack@a0b524e6af'
    '@dxos/ui-theme': 'https://pkg.pr.new/dxos/dxos/@dxos/ui-theme@a0b524e6af'
    '@dxos/util': 'https://pkg.pr.new/dxos/dxos/@dxos/util@a0b524e6af'

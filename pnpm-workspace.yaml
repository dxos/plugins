# Composer community plugins — pnpm workspace.
#
# Every plugin under packages/* pins the DXOS SDK via the `dxos` named catalog below.
# The SDK ships as a single unit, so one find-replace of the version/commit here bumps
# every plugin in lockstep.
#
# `main` tracks the latest DXOS build via pkg.pr.new (the nightly "SDK upgrade" PR), but
# releases require a published npm version — the release workflow refuses to publish a
# plugin while the `dxos` catalog points at a pkg.pr.new / prerelease pin. See RELEASING.md.

packages:
  - 'packages/*'

# External (non-@dxos) dependencies. Plugins reference these as `catalog:` so a version lives in
# exactly one place and every plugin resolves the same copy — duplicate React or Effect instances
# break hooks and service registries at runtime.
# Versions track the dxos monorepo's catalog. Deps the SDK itself resolves — `effect`, `react` and
# `react-dom` — must instead match the *pinned* SDK build in the `dxos` catalog below, not dxos
# main: a version the SDK does not also resolve installs a second copy, and Effect brands its types
# nominally, so a duplicate fails the typecheck rather than reporting a version conflict.
catalog:
  '@changesets/changelog-git': '^0.2.1'
  '@changesets/cli': '^2.27.10'
  '@effect-atom/atom-react': '^0.5.0'
  '@excalidraw/excalidraw': '^0.18.0'
  '@storybook/react-vite': '^10.4.2'
  '@types/react': '~19.2.17'
  '@types/react-dom': '~19.2.3'
  '@vitejs/plugin-react': '^6.0.3'
  effect: '3.21.4'
  eslint-plugin-import-x: '^4.17.1'
  eslint-plugin-perfectionist: '^5.10.0'
  eslint-plugin-unused-imports: '^4.4.1'
  oxfmt: '^0.60.0'
  oxlint: '1.74.0'
  oxlint-tsgolint: '^0.25.0'
  react: '~19.2.7'
  react-dom: '~19.2.7'
  storybook: '^10.4.2'
  typescript: '^6.0.3'
  vite: '^8.1.4'
  vite-plugin-wasm: '^3.6.0'
  vitest: '4.1.10'

catalogs:
  dxos:
    '@dxos/app-framework': 'https://pkg.pr.new/dxos/dxos/@dxos/app-framework@5b05d75'
    '@dxos/app-toolkit': 'https://pkg.pr.new/dxos/dxos/@dxos/app-toolkit@5b05d75'
    '@dxos/compute': 'https://pkg.pr.new/dxos/dxos/@dxos/compute@5b05d75'
    '@dxos/echo': 'https://pkg.pr.new/dxos/dxos/@dxos/echo@5b05d75'
    '@dxos/echo-client': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-client@5b05d75'
    '@dxos/echo-doc': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-doc@5b05d75'
    '@dxos/echo-react': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-react@5b05d75'
    '@dxos/effect': 'https://pkg.pr.new/dxos/dxos/@dxos/effect@5b05d75'
    '@dxos/eslint-plugin-rules': 'https://pkg.pr.new/dxos/dxos/@dxos/eslint-plugin-rules@5b05d75'
    '@dxos/log': 'https://pkg.pr.new/dxos/dxos/@dxos/log@5b05d75'
    '@dxos/plugin-space': 'https://pkg.pr.new/dxos/dxos/@dxos/plugin-space@5b05d75'
    '@dxos/react-ui': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui@5b05d75'
    '@dxos/react-ui-form': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui-form@5b05d75'
    '@dxos/schema': 'https://pkg.pr.new/dxos/dxos/@dxos/schema@5b05d75'
    '@dxos/util': 'https://pkg.pr.new/dxos/dxos/@dxos/util@5b05d75'

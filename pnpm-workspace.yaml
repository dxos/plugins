# Composer community plugins — pnpm workspace.
#
# Every plugin under plugins/* pins the DXOS SDK via the `dxos` named catalog below.
# The SDK ships as a single unit, so one find-replace of the version/commit here bumps
# every plugin in lockstep.
#
# `main` tracks the latest DXOS build via pkg.pr.new (the nightly "SDK upgrade" PR), but
# releases require a published npm version — the release workflow refuses to publish a
# plugin while the `dxos` catalog points at a pkg.pr.new / prerelease pin. See RELEASING.md.

packages:
  - 'packages/*'

catalogs:
  dxos:
    '@dxos/app-framework': 'https://pkg.pr.new/dxos/dxos/@dxos/app-framework@d94a5c53a2'
    '@dxos/app-toolkit': 'https://pkg.pr.new/dxos/dxos/@dxos/app-toolkit@d94a5c53a2'
    '@dxos/async': 'https://pkg.pr.new/dxos/dxos/@dxos/async@d94a5c53a2'
    '@dxos/client': 'https://pkg.pr.new/dxos/dxos/@dxos/client@d94a5c53a2'
    '@dxos/client-protocol': 'https://pkg.pr.new/dxos/dxos/@dxos/client-protocol@d94a5c53a2'
    '@dxos/compute': 'https://pkg.pr.new/dxos/dxos/@dxos/compute@d94a5c53a2'
    '@dxos/context': 'https://pkg.pr.new/dxos/dxos/@dxos/context@d94a5c53a2'
    '@dxos/echo': 'https://pkg.pr.new/dxos/dxos/@dxos/echo@d94a5c53a2'
    '@dxos/echo-client': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-client@d94a5c53a2'
    '@dxos/echo-react': 'https://pkg.pr.new/dxos/dxos/@dxos/echo-react@d94a5c53a2'
    '@dxos/effect': 'https://pkg.pr.new/dxos/dxos/@dxos/effect@d94a5c53a2'
    '@dxos/invariant': 'https://pkg.pr.new/dxos/dxos/@dxos/invariant@d94a5c53a2'
    '@dxos/log': 'https://pkg.pr.new/dxos/dxos/@dxos/log@d94a5c53a2'
    '@dxos/operation': 'https://pkg.pr.new/dxos/dxos/@dxos/operation@d94a5c53a2'
    '@dxos/plugin-space': 'https://pkg.pr.new/dxos/dxos/@dxos/plugin-space@d94a5c53a2'
    '@dxos/react-client': 'https://pkg.pr.new/dxos/dxos/@dxos/react-client@d94a5c53a2'
    '@dxos/react-ui': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui@d94a5c53a2'
    '@dxos/react-ui-form': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui-form@d94a5c53a2'
    '@dxos/react-ui-stack': 'https://pkg.pr.new/dxos/dxos/@dxos/react-ui-stack@d94a5c53a2'
    '@dxos/ui-theme': 'https://pkg.pr.new/dxos/dxos/@dxos/ui-theme@d94a5c53a2'
    '@dxos/util': 'https://pkg.pr.new/dxos/dxos/@dxos/util@d94a5c53a2'

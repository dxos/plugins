$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  lint:
    command: pnpm exec oxlint --config .oxlintrc.json $projectSource
    inputs:
      - /.oxlintrc.json
      - /package.json
      - '@group(sources)'
    options:
      # ignorePatterns breaks when not run from workspace root.
      runFromWorkspaceRoot: true

  lint-fix:
    command: pnpm exec oxlint --config .oxlintrc.json --fix $projectSource
    inputs:
      - /.oxlintrc.json
      - /package.json
      - '@group(sources)'
    options:
      runFromWorkspaceRoot: true
      runInCI: false

inheritedBy:
  toolchains: typescript

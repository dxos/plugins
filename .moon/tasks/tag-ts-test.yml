$schema: https://moonrepo.dev/schemas/tasks.json
tasks:
  test:
    command: pnpm exec vitest run --passWithNoTests
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - vitest.config.ts
    options:
      timeout: 300

  test-watch:
    command: pnpm exec vitest
    preset: server

inheritedBy:
  tags: ts-test

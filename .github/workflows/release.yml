name: Release

# Changesets-driven release, trunk-based on `main` — there is no long-lived release branch, matching
# dxos/dxos. Every push to `main`:
#  - with changesets pending, opens/updates a "Version Packages" PR (bumps each changed plugin's
#    version + CHANGELOG). Merging that PR is the human gate;
#  - with none left, tags the released versions and publishes the bumped plugins to the AT Protocol
#    registry via `dx registry publish`.
#
# Plugins carry independent version lines (`fixed: []`), but share one Version Packages PR, so a
# release ships whatever accumulated since the last one — independent numbers, coupled timing.
#
# Plugins are not yet published to npm: their `exports` describe a library (dist/lib, dist/types)
# that the plugin bundle does not emit, so publishing today would ship an unimportable package.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release guard — never publish against an unreleased SDK
        # Matches quoted @dxos/* entry values only, so the guard neither trips on the explanatory
        # pkg.pr.new mentions in the file header nor on a prerelease pin in the external catalog,
        # and does not go blind once the catalog outgrows a fixed line window.
        run: |
          if grep -qE "^[[:space:]]+'@dxos/[^']+':[[:space:]]*'[^']*pkg\.pr\.new" pnpm-workspace.yaml; then
            echo "::error::Refusing to release: the dxos catalog points at a pkg.pr.new pin. Run the SDK npm release workflow first (see RELEASING.md)."
            exit 1
          fi
          if grep -qE "^[[:space:]]+'@dxos/[^']+':[[:space:]]*'[^']*[0-9]+\.[0-9]+\.[0-9]+-" pnpm-workspace.yaml; then
            echo "::error::Refusing to release: the dxos catalog points at a prerelease version. Run the SDK npm release workflow first (see RELEASING.md)."
            exit 1
          fi

      - uses: ./.github/actions/setup

      # `changeset tag` stands in for `changeset publish` because plugins publish to the registry
      # rather than npm. It emits the same `New tag: name@version` lines the action parses, so
      # `publishedPackages` still reports exactly what this run released, and the action pushes the
      # tags. Tagging private packages requires `privatePackages.tag` in .changeset/config.json.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm exec changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish released plugins to the registry
        if: steps.changesets.outputs.published == 'true'
        env:
          # Pinned to a pkg.pr.new preview: npm's @dxos/cli@0.10.0 is broken (its binary embeds an
          # absolute path to the machine that built it). Override with the DX_CLI_PACKAGE repo
          # variable, and drop the default once a working CLI is on npm. Installing the single
          # linux-x64 package rather than the launcher avoids fetching all five platforms.
          DX_CLI_PACKAGE: ${{ vars.DX_CLI_PACKAGE || 'https://pkg.pr.new/dxos/dxos/@dxos/cli-linux-x64@4fb6037' }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
          ATPROTO_HANDLE: ${{ secrets.ATPROTO_HANDLE }}
          ATPROTO_APP_PASSWORD: ${{ secrets.ATPROTO_APP_PASSWORD }}
        run: |
          npm install -g "${DX_CLI_PACKAGE}"
          # Fail fast on a broken CLI rather than part-way through publishing.
          dx --version

          # Publish only what this run released; the registry rejects a re-publish of an unchanged
          # version, but relying on that would hide a genuine mistake.
          node -e '
            const fs = require("fs");
            const released = new Set(JSON.parse(process.env.PUBLISHED).map((p) => p.name));
            const dirs = fs.readdirSync("packages")
              .filter((dir) => fs.existsSync(`packages/${dir}/package.json`))
              .filter((dir) => released.has(JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, "utf8")).name));
            fs.writeFileSync("released-dirs.txt", dirs.map((dir) => `packages/${dir}`).join("\n"));
          '

          while read -r dir; do
            [ -n "${dir}" ] || continue
            echo "::group::Publishing ${dir}"
            dx registry publish --dir "${dir}"
            echo "::endgroup::"
          done < released-dirs.txt
